apply plugin: 'com.android.application'

// Release signing material is supplied from outside the repository: either via
// environment variables (M590_KEYSTORE / M590_KEYSTORE_PASSWORD / M590_KEY_ALIAS /
// M590_KEY_PASSWORD) or a gitignored android/keystore.properties. When neither is
// present the release build stays unsigned instead of failing, so debug builds and
// CI checks still work on machines without the upload key.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String env, String prop ->
    System.getenv(env) ?: keystoreProps.getProperty(prop)
}

def storePath = signingValue("M590_KEYSTORE", "storeFile")
def hasSigningKey = storePath != null && !storePath.isEmpty()

// A configured-but-unresolvable keystore is always a mistake, and letting it
// through would disable signing silently: the build still succeeds and the
// unsigned bundle is only rejected on upload. Note that Gradle resolves a
// relative path against this module directory (app/android/app/), not the repo
// root, so prefer an absolute path.
if (hasSigningKey && !file(storePath).exists()) {
    throw new GradleException(
        "M590_KEYSTORE/storeFile points at '${storePath}', which does not exist " +
        "(resolved to '${file(storePath).absolutePath}'). Use an absolute path.")
}

android {
    namespace "de.runlevel3.m590"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.runlevel3.m590"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 58
        versionName "0.1.53"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasSigningKey) {
        signingConfigs {
            release {
                storeFile file(storePath)
                storePassword signingValue("M590_KEYSTORE_PASSWORD", "storePassword")
                keyAlias signingValue("M590_KEY_ALIAS", "keyAlias")
                keyPassword signingValue("M590_KEY_PASSWORD", "keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
