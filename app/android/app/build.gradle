apply plugin: 'com.android.application'

// Release signing material is supplied from outside the repository: either via
// environment variables (M590_KEYSTORE / M590_KEYSTORE_PASSWORD / M590_KEY_ALIAS /
// M590_KEY_PASSWORD) or the gitignored app/.env.local, which uses those same
// names as plain key=value lines. When neither is present the release build stays
// unsigned instead of failing, so debug builds and CI checks still work on
// machines without the upload key.
//
// .env.local rather than .env: .env is tracked and this repository is public, so
// only a gitignored file may hold the passphrase. See app/.env.example.
def envFile = rootProject.file("../.env.local")
def envProps = new Properties()
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}

// The environment wins over the file, so a one-off inline override works without
// editing .env.local. Blank entries count as absent — .env.example ships the keys
// with empty values, and a copied-but-unfilled file must not look configured.
def signingValue = { String name ->
    def fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv
    def fromFile = envProps.getProperty(name)
    return (fromFile != null && !fromFile.trim().isEmpty()) ? fromFile.trim() : null
}

def storePath = signingValue("M590_KEYSTORE")
def hasSigningKey = storePath != null && !storePath.isEmpty()

// A configured-but-unresolvable keystore is always a mistake, and letting it
// through would disable signing silently: the build still succeeds and the
// unsigned bundle is only rejected on upload. Note that Gradle resolves a
// relative path against this module directory (app/android/app/), not the repo
// root, so prefer an absolute path.
if (hasSigningKey && !file(storePath).exists()) {
    throw new GradleException(
        "M590_KEYSTORE points at '${storePath}', which does not exist " +
        "(resolved to '${file(storePath).absolutePath}'). Use an absolute path.")
}

// Same reasoning for the rest of the material: a keystore configured without a
// password or alias yields an unsigned artifact that only fails on upload to
// Play, long after the build reported success. Fail here instead.
if (hasSigningKey) {
    def missing = ["M590_KEYSTORE_PASSWORD", "M590_KEY_ALIAS"].findAll { signingValue(it) == null }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "M590_KEYSTORE is set but ${missing.join(' and ')} " +
            "${missing.size() == 1 ? 'is' : 'are'} missing. Set ${missing.size() == 1 ? 'it' : 'them'} " +
            "in app/.env.local (see app/.env.example) or in the environment.")
    }
}

android {
    namespace "de.runlevel3.m590"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.runlevel3.m590"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 64
        versionName "0.1.58"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasSigningKey) {
        signingConfigs {
            release {
                storeFile file(storePath)
                storePassword signingValue("M590_KEYSTORE_PASSWORD")
                keyAlias signingValue("M590_KEY_ALIAS")
                // Keystores created by scripts/createUploadKeystore.sh share one
                // passphrase, so fall back to the store password when no separate
                // key password is configured.
                keyPassword signingValue("M590_KEY_PASSWORD") ?: signingValue("M590_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
