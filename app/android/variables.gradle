ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36

    // Only the versions app/build.gradle references directly are pinned here.
    // Everything the Capacitor runtime itself pulls in (core, activity, fragment,
    // webkit) is left to @capacitor/android's own defaults, which track the SDK it
    // targets — see node_modules/@capacitor/android/capacitor/build.gradle.
    // These values were a Capacitor 6/7 leftover and lagged behind: androidx.core
    // was pinned at 1.15.0, which does not compile against SDK 36.
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    coreSplashScreenVersion = '1.0.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
}
